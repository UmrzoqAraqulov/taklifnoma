<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -5 120 110">
  <defs>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#d1d5db" />
      <stop offset="100%" stop-color="#9ca3af" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Left Ring: Silver -->
  <circle cx="36" cy="45" r="32" fill="none" stroke="url(#silver)" stroke-width="12" filter="url(#shadow)" />
  
  <!-- Right Ring: Gold (lowered by 10 instead of 20) -->
  <circle cx="64" cy="55" r="32" fill="none" stroke="url(#gold)" stroke-width="12" filter="url(#shadow)" />
  
  <!-- Left Ring overlapping part (Top-Right quadrant) to create interlocking 3D effect -->
  <circle cx="36" cy="45" r="32" fill="none" stroke="url(#silver)" stroke-width="12" pathLength="100" stroke-dasharray="30 70" stroke-dashoffset="25" />
</svg>
